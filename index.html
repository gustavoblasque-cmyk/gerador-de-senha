<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas - Projeto Alura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1 class="titulo">Gerador de Senhas</h1>
        
        <div class="campo-senha">
            <input type="text" id="senha" readonly placeholder="Sua senha aparecerá aqui">
            <button id="btn-copiar" title="Copiar Senha">📋</button>
        </div>

        <div class="controles">
            <div class="tamanho-container">
                <label for="tamanho">Tamanho da senha: <span id="tamanho-valor">12</span></label>
                <input type="range" id="tamanho" min="6" max="30" value="12">
            </div>

            <div class="opcoes">
                <label>
                    <input type="checkbox" id="maiusculas" checked> Letras Maiúsculas (A-Z)
                </label>
                <label>
                    <input type="checkbox" id="minusculas" checked> Letras Minúsculas (a-z)
                </label>
                <label>
                    <input type="checkbox" id="numeros" checked> Números (0-9)
                </label>
                <label>
                    <input type="checkbox" id="simbolos" checked> Símbolos (!@#$)
                </label>
            </div>
        </div>

        <button id="btn-gerar" class="btn-principal">Gerar Senha</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
